# Cron esterno orario: Vercel Hobby non ammette cron nativi più frequenti di 1/giorno.
name: Ops sentinel

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke /api/ops-sentinel
        env:
          OPS_SENTINEL_SECRET: ${{ secrets.OPS_SENTINEL_SECRET }}
          OPS_SENTINEL_URL: ${{ secrets.OPS_SENTINEL_URL }}
        run: |
          set -eu
          URL="${OPS_SENTINEL_URL:-https://www.tarotitalia.com/api/ops-sentinel}"
          if [ -z "${OPS_SENTINEL_SECRET:-}" ]; then
            echo "Manca il secret GitHub OPS_SENTINEL_SECRET"
            exit 1
          fi
          CODE=$(curl -sS -m 20 -o /tmp/sentinel.json -w "%{http_code}" \
            -H "Authorization: Bearer ${OPS_SENTINEL_SECRET}" \
            -H "Accept: application/json" \
            "$URL")
          echo "HTTP ${CODE}"
          head -c 800 /tmp/sentinel.json || true
          echo
          if [ "$CODE" = "401" ] || [ "$CODE" = "404" ]; then
            exit 1
          fi
          if [ "$CODE" -ge 500 ] && [ "$CODE" != "503" ]; then
            exit 1
          fi
